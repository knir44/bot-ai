server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 12m;          # a bit above the backend's MAX_UPLOAD_MB

  # API calls go to the backend container -> the browser only ever talks to one origin (no CORS needed).
  location /api/ {
    proxy_pass http://backend:8000;
    proxy_read_timeout 120s;         # embedding a big upload can take a while
  }

  # React Router: any other path serves the SPA shell
  location / {
    try_files $uri /index.html;
  }
}
