# DocuMind RAG - the whole ecosystem with one command:
#   docker compose up --build
#
#   frontend  -> http://localhost:3000   (React widget + RAG Lab, served by nginx, proxies /api to backend)
#   backend   -> http://localhost:8001   (FastAPI, Swagger UI at /docs)
#   pgadmin   -> http://localhost:5050   (Postgres admin UI)
#   elasticsearch -> http://localhost:9200

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: documind-es
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false      # dev only! never do this in production
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  postgres:
    image: postgres:16-alpine
    container_name: documind-pg
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-documind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-documind_pw}
      POSTGRES_DB: ${POSTGRES_DB:-documind}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-documind} -d ${POSTGRES_DB:-documind}"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: documind-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build: ./backend
    container_name: documind-backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-documind}:${POSTGRES_PASSWORD:-documind_pw}@postgres:5432/${POSTGRES_DB:-documind}
      ELASTICSEARCH_URL: http://elasticsearch:9200
      SAMPLE_CORPUS_DIR: /app/sample_corpus
      LOG_DIR: /app/logs
    ports:
      - "8001:8000"
    volumes:
      - ./sample_corpus:/app/sample_corpus:ro
      - backend_logs:/app/logs
    depends_on:
      elasticsearch:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 60s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    build: ./frontend
    container_name: documind-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  es_data:
  pg_data:
  backend_logs:
